<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Helper Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"></head>
<body>
    <!-- chat page -->
    <div class="w-100 px-3 py-2">

        <!-- scrollable chat history -->
        <div class="container mt-4" style="max-width: 700px;">RESUME HELPER CHATBOT
            <div class="card mb-3">
                <div id="chat-scroll-box" class="card-body bg-light overflow-y-auto p-3" style="height: 400px;">
                    <div id="welcome-overlay" class="position-absolute top-50 start-50 translate-middle w-75 text-center text-secondary p-3">
                        <div class="mb-2"><i class="fa fa-comments-o fa-3x text-muted"></i></div>
                        <h5 class="text-dark fw-semibold">Welcome to the Resume Helper Chatbot!</h5>
                        <p class="small mb-0">
                            Type a message below to start your session. You can ask career questions, 
                            type <strong>"summarize my resume"</strong>, or <strong>"find my skill gaps"</strong> with an attached file!
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- user input form -->
        <form id="chat-input-form" class="container" style="max-width: 700px;">
            <div id="resume-preview-bar" class="d-none border border-3 border-info rounded align-items-center justify-content-between bg-white p-2 mb-2">
                <div class="d-flex align-items-center text-truncate me-2">
                    <i class="fa fa-file-text-o text-dark me-2"></i>
                    <span id="resume-preview-name" class="text-dark small text-truncate fw-semibold">resume.txt</span>
                </div>
                <button type="button" id="cancel-file" class="btn btn-sm btn-link text-danger p-0 text-decoration-none">
                    <i class="fa fa-trash fa-lg"></i>
                </button>
            </div>
            <div class="input-group">
                <label class="btn btn-secondary d-flex align-items-center" for="resume-upload">
                    <i class="fa fa-upload fa-lg"></i>
                    <input id="resume-upload" type="file" class="d-none" accept=".pdf, .txt">
                </label>
                <input id="user-message" type="text" class="form-control" placeholder="Type your message here" value="">
                <button type="submit" class="btn btn-info d-flex align-items-center px-4">Send</button>
            </div>
        </form>

    </div>

    <h3 class="d-none">{{ message }}</h3>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', path='/chat.js') }}"></script>
</body>
</html>
